<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA8FF"/><stop offset="0.55" stop-color="#2F6FED"/><stop offset="1" stop-color="#1B3A8C"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE58A"/><stop offset="0.6" stop-color="#FFC23D"/><stop offset="1" stop-color="#FF9A1F"/>
    </radialGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#FFD35C" stop-opacity="0.5"/><stop offset="1" stop-color="#FFD35C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nuvem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8FA"/>
    </linearGradient>
    <style>
      .brilho { transform-box: fill-box; transform-origin: center; animation: pulsar 3.2s ease-in-out infinite; }
      .nuvem { animation: flutuar 5s ease-in-out infinite; }
      .fundo-nuvem { animation: deslizar 26s linear infinite; }
      .vento { animation: soprar 2.6s ease-in-out infinite; }
      .vento2 { animation: soprar 2.6s ease-in-out 0.4s infinite; }
      .gota { animation: cair 1.4s linear infinite; }
      @keyframes pulsar { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.12); opacity: 1 } }
      @keyframes flutuar { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @keyframes deslizar { from { transform: translateX(-260px) } to { transform: translateX(1260px) } }
      @keyframes soprar { 0%,100% { transform: translateX(0) } 50% { transform: translateX(46px) } }
      @keyframes cair { from { transform: translateY(-40px); opacity: 0 } 20% { opacity: .55 } to { transform: translateY(380px); opacity: 0 } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#ceu)"/>
  <!-- nuvens de fundo passando -->
  <g class="fundo-nuvem" fill="#FFFFFF" opacity="0.12">
    <ellipse cx="0" cy="70" rx="90" ry="26"/><ellipse cx="40" cy="55" rx="55" ry="30"/>
    <ellipse cx="520" cy="300" rx="110" ry="24"/><ellipse cx="560" cy="285" rx="60" ry="28"/>
  </g>
  <!-- gotas sutis à direita -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line class="gota" style="animation-delay:0.00s" x1="1040" y1="0" x2="1040" y2="16"/><line class="gota" style="animation-delay:0.23s" x1="1080" y1="0" x2="1080" y2="16"/><line class="gota" style="animation-delay:0.46s" x1="1115" y1="0" x2="1115" y2="16"/><line class="gota" style="animation-delay:0.69s" x1="1150" y1="0" x2="1150" y2="16"/><line class="gota" style="animation-delay:0.92s" x1="1000" y1="0" x2="1000" y2="16"/><line class="gota" style="animation-delay:1.15s" x1="960" y1="0" x2="960" y2="16"/>
  </g>
  <!-- logo -->
  <g transform="translate(40 30) scale(0.3)">
    <g transform="translate(0 -40)">
      <circle class="brilho" cx="620" cy="370" r="215" fill="url(#brilho)"/>
      <circle cx="620" cy="370" r="145" fill="url(#sol)"/>
      <g class="nuvem" fill="url(#nuvem)">
        <rect x="250" y="520" width="540" height="150" rx="75"/><circle cx="415" cy="525" r="125"/>
        <circle cx="590" cy="480" r="150"/><circle cx="715" cy="565" r="95"/>
      </g>
      <path class="vento" d="M300 760 Q390 718 480 760 T660 760" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
      <path class="vento2" d="M430 842 Q515 804 600 842 T770 842" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="38" stroke-linecap="round"/>
    </g>
  </g>
  <text x="345" y="165" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">WeatherFlow</text>
  <text x="349" y="215" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity="0.9">O clima explicado de um jeito que faz sentido.</text>
  <text x="349" y="262" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.7">React Native • Expo • TypeScript</text>
</svg>